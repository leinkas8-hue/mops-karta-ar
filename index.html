<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мопс Карта — AR-приключение</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 20px 14px 36px;
    font-family: "Trebuchet MS", Arial, sans-serif;
    color: #493326;
    background: linear-gradient(180deg, #fff4dc 0%, #ffe4c5 100%);
    text-align: center;
  }

  h1 {
    margin: 8px 0;
    font-size: clamp(28px, 7vw, 40px);
    color: #8b4b27;
    text-shadow: 0 2px 0 #fff;
  }

  h2, h3 {
    color: #8b4b27;
  }

  p {
    line-height: 1.5;
  }

  .card {
    width: 100%;
    max-width: 520px;
    margin: 18px auto;
    padding: 20px;
    background: #fffdf7;
    border: 2px solid #f3d2a8;
    border-radius: 26px;
    box-shadow: 0 7px 0 #e9c49b, 0 12px 24px #9d63301c;
  }

  #stage {
    position: relative;
    width: 100%;
    max-width: 460px;
    min-height: 260px;
    margin: 18px auto;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #bce8f2 0%, #e6f7df 72%, #a8d68c 72%);
    border: 4px solid #fff;
    border-radius: 28px;
    box-shadow: 0 6px 0 #d9bd94;
  }

  #camera {
    width: 100%;
    height: 100%;
    min-height: 260px;
    position: absolute;
    inset: 0;
    object-fit: cover;
    border-radius: 22px;
  }

  #pug {
    position: relative;
    z-index: 2;
    font-size: 92px;
    line-height: 1.2;
    filter: drop-shadow(0 7px 3px #5b442944);
    animation: pugBounce 2.2s ease-in-out infinite;
  }

  #hint {
    position: relative;
    z-index: 3;
    margin: 12px auto;
    padding: 12px 16px;
    max-width: 440px;
    color: #684323;
    background: #fff9e9;
    border: 2px solid #f1d29e;
    border-radius: 18px;
    font-weight: bold;
  }

  button {
    display: inline-block;
    margin: 6px 3px;
    padding: 13px 18px;
    border: 0;
    border-radius: 18px;
    background: #f3a943;
    color: #492c17;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 0 #cb8129;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 0 #cb8129;
  }

  button:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #cb8129;
  }

  #score, #scoreLabel {
    color: #28774a;
    font-weight: bold;
  }

  @keyframes pugBounce {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-8px) rotate(2deg); }
  }

  max-width: 480px {
    body {
      padding: 14px 10px 28px;
    }

    .card {
      padding: 15px;
      border-radius: 22px;
    }

    button {
      width: 100%;
      margin: 7px 0;
      padding: 14px 10px;
    }
  }

  prefers-reduced-motion: reduce {
    #pug {
      animation: none;
    }
  }
</style>
</head>
<body>
<header>
  <h1>🐶 Мопс Карта</h1>
  <div>Твоё городское приключение</div>
</header>
<main>
  <section class="card">
    <div id="stage">
      <video id="camera" autoplay playsinline hidden></video>
      <div id="pug">🐶</div>
      <div id="hint">Привет, исследователь! Нажми «Начать приключение».</div>
    </div>
    <button onclick="startAdventure()">📸 Начать приключение</button>
    <button class="secondary" onclick="tellStory()">🔊 Послушать историю</button>
  </section>
  <section class="card">
    <div id="score">⭐ Очки: 0</div>
    <p id="task">🎯 Задание: познакомься с мопсом-проводником!</p>
    <button onclick="completeTask()">🏆 Выполнить задание</button>
    <p class="small">Подсказка: разреши доступ к камере, когда браузер спросит.</p>
  </section>
</main>
<script>
const video=document.getElementById("camera");
const hint=document.getElementById("hint");
const scoreLabel=document.getElementById("score");
let score=0;
let stream=null;
let taskDone=false;

async function startAdventure() {
  const hint = document.getElementById("hint");
  const video = document.getElementById("camera");
  const pug = document.getElementById("pug");
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    hint.textContent = "Камера недоступна. Открой сайт по HTTPS в современном браузере.";
    return;
  }
  try {
    if (!window.stream) {
      window.stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false
      });
    }
    video.srcObject = window.stream;
    video.hidden = false;
    await video.play();
    hint.textContent = "Гав! Приключение началось! Я твой мопс-проводник 🐾";
    if (pug) {
      pug.style.fontSize = "76px";
    }
  } catch (error) {
    hint.textContent = "Не удалось открыть камеру. Проверь разрешение камеры в настройках браузера.";
    console.error(error);
  }
}

function tellStory() {
  const story = "Привет, путешественник! Я мопс Карта. В каждом старинном здании спрятана своя история. Посмотри вокруг, найди интересное место и отправляйся за новыми открытиями!";
  const hint = document.getElementById("hint");
  if (hint) {
    hint.textContent = story;
  }
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(story);
    utterance.lang = "ru-RU";
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
  }
}

function completeTask() {
  if (taskDone) {
    document.getElementById("task").textContent =
      "✅ Задание уже выполнено. Отличная работа!";
    return;
  }
  taskDone = true;
  score += 10;
  scoreLabel.textContent = "⭐ Очки: " + score;
  document.getElementById("task").textContent =
    "✅ Первое задание выполнено! Ты получил 10 очков!";
  hint.textContent = "Ура! Ты начинаешь путь исследователя города! 🏆";
}
</script>
</body>
</html>
